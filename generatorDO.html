<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator profilu</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f2f4f8;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #222;
}

.input-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #444;
    font-weight: bold;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #dcdcdc;
    font-size: 15px;
    background: #fafafa;
}

input:focus {
    outline: none;
    border-color: #3b82f6;
    background: white;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: #3b82f6;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    opacity: 0.95;
}

.success {
    margin-top: 15px;
    text-align: center;
    color: green;
    display: none;
}
</style>
</head>
<body>

<div class="container">
    <h1>Generator danych</h1>

    <div class="input-group">
        <label>Imię</label>
        <input id="name" type="text">
    </div>

    <div class="input-group">
        <label>Nazwisko</label>
        <input id="surname" type="text">
    </div>

    <div class="input-group">
        <label>Obywatelstwo</label>
        <input id="nationality" type="text">
    </div>

    <div class="input-group">
        <label>Data urodzenia</label>
        <input id="birthDate" type="text">
    </div>

    <div class="input-group">
        <label>PESEL</label>
        <input id="pesel" type="text">
    </div>

    <div class="input-group">
        <label>Seria</label>
        <input id="md_idSeries" type="text">
    </div>

    <div class="input-group">
        <label>Data ważności</label>
        <input id="md_expiryDate" type="text">
    </div>

    <div class="input-group">
        <label>Data wydania</label>
        <input id="md_issueDate" type="text">
    </div>

    <div class="input-group">
        <label>Imię ojca</label>
        <input id="fathername" type="text">
    </div>

    <div class="input-group">
        <label>Imię matki</label>
        <input id="mothername" type="text">
    </div>

    <div class="input-group">
        <label>Adres</label>
        <input id="address" type="text">
    </div>

    <button onclick="saveData()">
        Zapisz dane
    </button>

    <div class="success" id="success">
        Dane zapisane poprawnie
    </div>
</div>

<script>
function saveData() {

    localStorage.setItem("name", document.getElementById("name").value);
    localStorage.setItem("surname", document.getElementById("surname").value);
    localStorage.setItem("nationality", document.getElementById("nationality").value);
    localStorage.setItem("birthDate", document.getElementById("birthDate").value);
    localStorage.setItem("pesel", document.getElementById("pesel").value);

    localStorage.setItem("md_idSeries", document.getElementById("md_idSeries").value);
    localStorage.setItem("md_expiryDate", document.getElementById("md_expiryDate").value);
    localStorage.setItem("md_issueDate", document.getElementById("md_issueDate").value);

    localStorage.setItem("fathername", document.getElementById("fathername").value);
    localStorage.setItem("mothername", document.getElementById("mothername").value);

    localStorage.setItem("address", document.getElementById("address").value);

    document.getElementById("success").style.display = "block";

    setTimeout(() => {
        document.getElementById("success").style.display = "none";
    }, 3000);
}
</script>

</body>
</html>
```
